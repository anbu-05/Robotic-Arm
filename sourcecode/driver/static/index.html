<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>robarm driver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');

  :root {
    --bg:       #0e0e0e;
    --panel:    #141414;
    --border:   #2a2a2a;
    --accent:   #c8ff00;
    --accent2:  #ff6b35;
    --muted:    #555;
    --text:     #e0e0e0;
    --dim:      #888;
    --ok:       #3ddc84;
    --err:      #ff4444;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── layout ── */
  #app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 48px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── header ── */
  #header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #header .logo {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  #header .sep { color: var(--border); }
  #conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--err);
    transition: background 0.3s;
  }
  #conn-dot.on { background: var(--ok); }
  #conn-label { color: var(--dim); font-size: 12px; }

  /* ── sidebar ── */
  #sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── connect panel ── */
  #connect-panel {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { color: var(--dim); width: 48px; flex-shrink: 0; }

  select, input[type="text"], input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    flex: 1;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus { border-color: var(--accent); }

  /* ── buttons ── */
  .btn {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.primary:hover { background: var(--accent); color: #000; }
  .btn.danger { border-color: var(--err); color: var(--err); }
  .btn.danger:hover { background: var(--err); color: #fff; }
  .btn.stop-btn {
    border-color: var(--accent2);
    color: var(--accent2);
    width: 100%;
    padding: 6px;
  }
  .btn.stop-btn:hover { background: var(--accent2); color: #fff; }
  .btn.apply-btn {
    font-size: 10px;
    padding: 3px 8px;
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn.apply-btn:hover { background: var(--accent); color: #000; }

  /* ── poll panel ── */
  #poll-panel {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #poll-panel label { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #poll-panel input { width: 72px; flex: unset; }
  #poll-panel span { color: var(--muted); font-size: 11px; }

  /* ── command console ── */
  #console-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 16px;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px;
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .log-tx { color: var(--accent); }
  .log-rx { color: var(--dim); }
  .log-err { color: var(--err); }
  .log-sys { color: var(--muted); font-style: italic; }

  #cmd-input-row { display: flex; gap: 6px; }
  #cmd-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
  }
  #cmd-input:focus { border-color: var(--accent); }

  /* ── main motor area ── */
  #motors-area {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── motor card ── */
  .motor-card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px 16px;
    transition: border-color 0.2s;
  }
  .motor-card:hover { border-color: #3a3a3a; }

  .motor-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .motor-id {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    width: 36px;
    flex-shrink: 0;
  }
  .motor-name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    padding: 2px 0;
    width: 140px;
    outline: none;
    transition: border-color 0.15s;
  }
  .motor-name-input:focus { border-color: var(--accent); }

  /* constants row */
  .constants-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .const-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .const-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .const-input {
    width: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .const-input:focus { border-color: var(--accent); }
  .const-input.narrow { width: 40px; }

  /* slider row */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slider-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    width: 50px;
    flex-shrink: 0;
  }
  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .slider-val {
    width: 48px;
    text-align: right;
    color: var(--accent);
    font-size: 13px;
  }
  .slider-num-input {
    width: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 6px;
    outline: none;
    transition: border-color 0.15s;
  }
  .slider-num-input:focus { border-color: var(--accent); }

  /* speed row */
  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  /* status row */
  .status-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 12px;
  }
  .stat-group {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    min-width: 40px;
  }
  .stat-value.cur { color: var(--ok); }
  .stat-value.diff-pos { color: var(--accent); }
  .stat-value.diff-neg { color: var(--accent2); }

  /* progress bar */
  .pos-bar-wrap {
    height: 3px;
    background: var(--border);
    margin-bottom: 12px;
    position: relative;
  }
  .pos-bar-cur {
    position: absolute;
    height: 100%;
    background: var(--ok);
    transition: width 0.15s;
  }
  .pos-bar-tgt {
    position: absolute;
    width: 2px;
    height: 8px;
    top: -2px;
    background: var(--accent);
    transition: left 0.15s;
  }
  .pos-bar-start {
    position: absolute;
    width: 2px;
    height: 6px;
    top: -1px;
    background: var(--muted);
    transition: left 0.15s;
  }
  .pos-bar-end {
    position: absolute;
    width: 2px;
    height: 6px;
    top: -1px;
    background: var(--muted);
    transition: left 0.15s;
  }

  .bottom-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ── scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <span class="logo">robarm</span>
    <span class="sep">/</span>
    <span class="logo" style="color:var(--text);font-weight:400">driver</span>
    <div style="flex:1"></div>
    <button class="btn" id="stop-all-btn" onclick="doStopAll()"
      style="border-color:#ff4444;color:#ff4444;font-size:12px;letter-spacing:0.1em;padding:5px 18px;"
      onmouseover="this.style.background='#ff4444';this.style.color='#fff'"
      onmouseout="this.style.background='transparent';this.style.color='#ff4444'">
      ■ STOP ALL
    </button>
    <div id="conn-dot"></div>
    <span id="conn-label">disconnected</span>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">

    <!-- connect panel -->
    <div id="connect-panel">
      <div class="panel-title">serial connection</div>
      <div class="row">
        <label>port</label>
        <select id="port-select"></select>
        <button class="btn" onclick="refreshPorts()" title="refresh">↺</button>
      </div>
      <div class="row">
        <label>baud</label>
        <input type="number" id="baud-input" value="115200">
      </div>
      <div class="row" style="justify-content:flex-end;gap:6px">
        <button class="btn danger" onclick="doDisconnect()">disconnect</button>
        <button class="btn primary" onclick="doConnect()">connect</button>
      </div>
    </div>

    <!-- poll interval -->
    <div id="poll-panel">
      <label>read freq</label>
      <input type="number" id="poll-input" value="100" min="50" max="10000">
      <span>ms</span>
      <button class="btn apply-btn" onclick="setPollInterval()">apply</button>
      <button class="btn apply-btn" onclick="fetchMotorParams()" title="read flipdir/pos_start/pos_end from firmware for all motors" style="margin-left:4px">get motor params</button>
    </div>

    <!-- command console -->
    <div id="console-panel">
      <div class="panel-title">command console</div>
      <div id="log"></div>
      <div id="cmd-input-row">
        <input type="text" id="cmd-input" placeholder="type command..." onkeydown="cmdKeydown(event)">
        <button class="btn primary" onclick="sendCmd()">send</button>
      </div>
    </div>

  </div>

  <!-- MOTORS AREA -->
  <div id="motors-area" class="motors-area"></div>

</div>

<script>
// ─── state ───────────────────────────────────────────────────────────────────

const MOTOR_IDS = ["M0A","M0B","M1A","M1B","M2A","M2B"];
let motorConfig = {};    // loaded from server
let targetPos   = {};    // slider values per motor
let targetSpeed = {};    // speed per motor

// init defaults
MOTOR_IDS.forEach(m => {
  targetPos[m]   = 0;
  targetSpeed[m] = 128;
});

// ─── api helpers ─────────────────────────────────────────────────────────────

async function api(path, method = "GET", body = null) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

// ─── log ─────────────────────────────────────────────────────────────────────

function log(text, cls = "log-sys") {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// ─── connection ──────────────────────────────────────────────────────────────

async function refreshPorts() {
  const ports = await api("/api/ports");
  const sel = document.getElementById("port-select");
  const prev = sel.value;
  sel.innerHTML = "";
  ports.forEach(p => {
    const opt = document.createElement("option");
    opt.value = opt.textContent = p;
    sel.appendChild(opt);
  });
  if (prev && ports.includes(prev)) sel.value = prev;
}

async function doConnect() {
  const port = document.getElementById("port-select").value;
  const baud = parseInt(document.getElementById("baud-input").value);
  if (!port) { log("no port selected", "log-err"); return; }
  log(`connecting to ${port} @ ${baud}...`);
  const r = await api("/api/connect", "POST", { port, baud });
  if (r.ok) {
    setConnected(true);
    log(`connected`, "log-sys");
  } else {
    log(`connect failed: ${r.error}`, "log-err");
  }
}

async function doDisconnect() {
  await api("/api/disconnect", "POST");
  setConnected(false);
  log("disconnected", "log-sys");
}

function setConnected(on) {
  document.getElementById("conn-dot").className  = on ? "on" : "";
  document.getElementById("conn-label").textContent = on ? "connected" : "disconnected";
}

// ─── command console ─────────────────────────────────────────────────────────

// strip microrl terminal escape sequences and non-printable chars from firmware reply
function cleanReply(str) {
  str = str.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");   // ANSI escape codes
  str = str.replace(/[\x00-\x08\x0b-\x0c\x0e-\x1f\x7f]/g, "");  // other control chars
  return str.trim();
}

// log a reply — splits on newlines so each line gets its own log entry
function logReply(str, cls = "log-rx") {
  str = cleanReply(str);
  str.split(/\r?\n/).forEach(line => {
    line = line.trim();
    if (line) log(line, cls);
  });
}

async function sendCmd() {
  const inp = document.getElementById("cmd-input");
  const cmd = inp.value.trim();
  if (!cmd) return;
  log("> " + cmd, "log-tx");
  inp.value = "";
  const r = await api("/api/command", "POST", { cmd });
  if (r.reply) logReply(r.reply);
}

async function doStopAll() {
  log("> stop", "log-tx");
  const r = await api("/api/command", "POST", { cmd: "stop" });
  logReply(r.reply);
}

function cmdKeydown(e) {
  if (e.key === "Enter") sendCmd();
}

// ─── poll interval ───────────────────────────────────────────────────────────

async function setPollInterval() {
  const ms = parseInt(document.getElementById("poll-input").value);
  const r = await api("/api/poll_interval", "POST", { ms });
  log(`poll interval set to ${r.ms}ms`, "log-sys");
}

// ─── motor config ────────────────────────────────────────────────────────────

async function loadMotorConfig() {
  motorConfig = await api("/api/motor_config");
}

async function applyMotorConfig(motorId) {
  const cfg = {
    motor_id:  motorId,
    name:      document.getElementById(`name-${motorId}`).value,
    flipdir:   parseInt(document.getElementById(`flipdir-${motorId}`).value),
    pos_start: parseInt(document.getElementById(`pos_start-${motorId}`).value),
    pos_end:   parseInt(document.getElementById(`pos_end-${motorId}`).value),
  };
  log(`applying config for ${motorId}...`);
  const r = await api("/api/motor_config", "POST", cfg);
  if (r.ok) {
    log(`${motorId} config applied. fw: ${r.firmware_replies.join(" | ")}`, "log-rx");
    motorConfig[motorId] = { ...motorConfig[motorId], ...cfg };
    updatePosMarkers(motorId);
  } else {
    log(`error: ${r.error}`, "log-err");
  }
}

// ─── setpos / stoppos ────────────────────────────────────────────────────────

async function doSetpos(motorId) {
  const pos   = targetPos[motorId];
  const speed = targetSpeed[motorId];
  log(`> setpos ${motorId} ${pos} ${speed}`, "log-tx");
  const r = await api("/api/setpos", "POST", { motor_id: motorId, pos, speed });
  log(r.reply, "log-rx");
}

async function doStoppos(motorId) {
  log(`> stoppos ${motorId}`, "log-tx");
  const r = await api("/api/stoppos", "POST", { motor_id: motorId });
  log(r.reply, "log-rx");
}

// ─── position polling + UI update ────────────────────────────────────────────

async function pollPositions() {
  const positions = await api("/api/positions");
  MOTOR_IDS.forEach(m => {
    const cur = positions[m] ?? 0;
    const tgt = targetPos[m];
    const diff = cur - tgt;

    const curEl  = document.getElementById(`cur-${m}`);
    const diffEl = document.getElementById(`diff-${m}`);
    const barCur = document.getElementById(`bar-cur-${m}`);
    const barTgt = document.getElementById(`bar-tgt-${m}`);

    if (curEl)  curEl.textContent = cur;
    if (diffEl) {
      diffEl.textContent = (diff >= 0 ? "+" : "") + diff;
      diffEl.className   = "stat-value " + (diff === 0 ? "" : diff > 0 ? "diff-pos" : "diff-neg");
    }
    if (barCur) barCur.style.width = (cur / 4095 * 100) + "%";
    if (barTgt) barTgt.style.left  = (tgt / 4095 * 100) + "%";
  });
}

// ─── build motor cards ───────────────────────────────────────────────────────

function buildMotorCards() {
  const area = document.getElementById("motors-area");
  area.innerHTML = "";

  MOTOR_IDS.forEach(motorId => {
    const cfg = motorConfig[motorId] || {
      name: motorId, flipdir: 0, pos_start: 0, pos_end: 4095, speed: 128
    };
    const speed = cfg.speed ?? 128;
    targetSpeed[motorId] = speed;

    const card = document.createElement("div");
    card.className = "motor-card";
    card.id = `card-${motorId}`;

    card.innerHTML = `
      <div class="motor-header">
        <span class="motor-id">${motorId}</span>
        <input class="motor-name-input" id="name-${motorId}" value="${cfg.name}" placeholder="name...">
        <div style="flex:1"></div>
        <button class="btn apply-btn" onclick="applyMotorConfig('${motorId}')">apply</button>
      </div>

      <div class="constants-row">
        <div class="const-group">
          <span class="const-label">flipdir</span>
          <input class="const-input narrow" id="flipdir-${motorId}" type="number" min="0" max="1" value="${cfg.flipdir}">
        </div>
        <div class="const-group">
          <span class="const-label">pos_start</span>
          <input class="const-input" id="pos_start-${motorId}" type="number" min="0" max="4095" value="${cfg.pos_start}" onchange="updatePosMarkers('${motorId}')">
        </div>
        <div class="const-group">
          <span class="const-label">pos_end</span>
          <input class="const-input" id="pos_end-${motorId}" type="number" min="0" max="4095" value="${cfg.pos_end}" onchange="updatePosMarkers('${motorId}')">
        </div>
      </div>

      <div class="slider-row">
        <span class="slider-label">target</span>
        <input type="range" id="slider-${motorId}" min="0" max="4095" value="0"
          oninput="onSlider('${motorId}', this.value)">
        <input class="slider-num-input" id="slidernum-${motorId}" type="number" min="0" max="4095" value="0"
          onchange="onSliderNum('${motorId}', this.value)">
      </div>

      <div class="speed-row">
        <span class="slider-label">speed</span>
        <input type="range" id="speed-slider-${motorId}" min="1" max="255" value="${speed}"
          oninput="onSpeed('${motorId}', this.value)">
        <input class="slider-num-input" id="speednum-${motorId}" type="number" min="1" max="255" value="${speed}"
          onchange="onSpeedNum('${motorId}', this.value)">
      </div>

      <div class="pos-bar-wrap">
        <div class="pos-bar-cur" id="bar-cur-${motorId}" style="width:0%"></div>
        <div class="pos-bar-tgt" id="bar-tgt-${motorId}" style="left:0%"></div>
        <div class="pos-bar-start" id="bar-start-${motorId}"></div>
        <div class="pos-bar-end" id="bar-end-${motorId}"></div>
      </div>

      <div class="status-row">
        <div class="stat-group">
          <span class="stat-label">current</span>
          <span class="stat-value cur" id="cur-${motorId}">—</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">target</span>
          <span class="stat-value" id="tgt-display-${motorId}">0</span>
        </div>
        <div class="stat-group">
          <span class="stat-label">Δ</span>
          <span class="stat-value" id="diff-${motorId}">—</span>
        </div>
      </div>

      <div class="bottom-row">
        <button class="btn primary" style="flex:1" onclick="doSetpos('${motorId}')">set pos</button>
        <button class="btn stop-btn" style="flex:0;width:80px" onclick="doStoppos('${motorId}')">stop</button>
      </div>
    `;

    area.appendChild(card);
    updatePosMarkers(motorId);
  });
}

// slider sync helpers
function onSlider(motorId, val) {
  val = parseInt(val);
  targetPos[motorId] = val;
  document.getElementById(`slidernum-${motorId}`).value  = val;
  document.getElementById(`tgt-display-${motorId}`).textContent = val;
  const barTgt = document.getElementById(`bar-tgt-${motorId}`);
  if (barTgt) barTgt.style.left = (val / 4095 * 100) + "%";
}

function onSliderNum(motorId, val) {
  val = Math.max(0, Math.min(4095, parseInt(val) || 0));
  targetPos[motorId] = val;
  document.getElementById(`slider-${motorId}`).value      = val;
  document.getElementById(`tgt-display-${motorId}`).textContent = val;
  document.getElementById(`slidernum-${motorId}`).value   = val;
}

function onSpeed(motorId, val) {
  val = Math.max(1, Math.min(255, parseInt(val) || 128));
  targetSpeed[motorId] = val;
  document.getElementById(`speednum-${motorId}`).value = val;
  saveMotorSpeed(motorId, val);
}

function onSpeedNum(motorId, val) {
  val = Math.max(1, Math.min(255, parseInt(val) || 128));
  targetSpeed[motorId] = val;
  document.getElementById(`speed-slider-${motorId}`).value = val;
  document.getElementById(`speednum-${motorId}`).value     = val;
  saveMotorSpeed(motorId, val);
}

function updatePosMarkers(motorId) {
  const startVal = parseInt(document.getElementById(`pos_start-${motorId}`).value) || 0;
  let endVal = parseInt(document.getElementById(`pos_end-${motorId}`).value);
  if (isNaN(endVal)) endVal = 4095;
  const barStart = document.getElementById(`bar-start-${motorId}`);
  const barEnd = document.getElementById(`bar-end-${motorId}`);
  if (barStart) barStart.style.left = (startVal / 4095 * 100) + "%";
  if (barEnd) barEnd.style.left = (endVal / 4095 * 100) + "%";
}

async function saveMotorSpeed(motorId, speed) {
  const r = await api("/api/motor_speed", "POST", { motor_id: motorId, speed });
  if (!r.ok) {
    log(`failed to save speed for ${motorId}: ${r.error}`, "log-err");
  }
}

// ─── fetch motor params from firmware → update GUI ───────────────────────────

async function fetchMotorParams() {
  log("fetching motor params from firmware...", "log-sys");
  const data = await api("/api/fetch_motor_params");
  MOTOR_IDS.forEach(m => {
    if (!data[m]) return;
    const p = data[m];
    if (p.flipdir   !== null) document.getElementById(`flipdir-${m}`).value   = p.flipdir;
    if (p.pos_start !== null) document.getElementById(`pos_start-${m}`).value = p.pos_start;
    if (p.pos_end   !== null) document.getElementById(`pos_end-${m}`).value   = p.pos_end;
    log(`${m}: flipdir=${p.flipdir} pos_start=${p.pos_start} pos_end=${p.pos_end}`, "log-rx");
    updatePosMarkers(m);
  });
}

// ─── init ─────────────────────────────────────────────────────────────────────

async function init() {
  await refreshPorts();
  await loadMotorConfig();
  buildMotorCards();

  // check if already connected (page refresh)
  const s = await api("/api/status");
  setConnected(s.connected);

  // autoreconnect to last port if not already connected
  if (!s.connected) {
    const last = await api("/api/last_port");
    if (last.port) {
      // select last port in dropdown if present
      const sel = document.getElementById("port-select");
      const opts = Array.from(sel.options).map(o => o.value);
      if (opts.includes(last.port)) {
        sel.value = last.port;
        document.getElementById("baud-input").value = last.baud;
        log(`autoreconnecting to ${last.port}...`, "log-sys");
        const r = await api("/api/connect", "POST", { port: last.port, baud: last.baud });
        if (r.ok) {
          setConnected(true);
          log("autoreconnect OK", "log-sys");
        } else {
          log(`autoreconnect failed: ${r.error}`, "log-err");
        }
      }
    }
  }

  log("robarm driver ready", "log-sys");

  // start position polling loop
  async function pollLoop() {
    await pollPositions();
    const r = await api("/api/poll_interval");
    setTimeout(pollLoop, r.ms);
  }
  pollLoop();
}

init();
</script>
